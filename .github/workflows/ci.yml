name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Dépendances
        run: uv sync --locked

      - name: Formatage
        run: uv run ruff format --check

      - name: Lint
        run: uv run ruff check

      - name: Typage
        run: uv run mypy

      - name: Tests
        run: uv run pytest
